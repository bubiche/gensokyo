# share/tmux.conf - static options for gensokyo's own tmux server (tmux -L gensokyo).
#
# Only options that need no runtime values live here. Prefix, key bindings, status
# formats and colours are applied by bin/gensokyo right after the server starts,
# because they need the script's absolute path and the user's config. The user's
# ~/.config/gensokyo/tmux.conf is sourced after everything else, so it can override
# anything below. The user's ~/.tmux.conf is never read (own -f, own socket).

set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000

# Shift+Enter must reach Claude Code as a newline, not as Enter. With tmux defaults
# (extended-keys off) it arrives as a plain Enter and submits the prompt.
set -s extended-keys on
set -s extended-keys-format csi-u

# Two-row status line at the top: row 0 residents, row 1 clock / legend / usage.
set -g status on
set -g status 2
set -g status-position top
set -g status-interval 3
set -g status-justify left
set -g status-left ""
set -g status-right ""

# Pane borders carry the resident's name (Claude Code sets the pane title to "✳ <name>",
# following --name and /rename).
set -g pane-border-status top
set -g pane-border-lines single

# "Needs you" bell: a hook writes \a to the pane tty, tmux forwards it to the client.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Window names are ours, not the shell's: one window per resident, named "<slot> <glyph>
# <name>", which iTerm2 shows as the tab title and gensokyo rewrites as the state changes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off
set -g allow-rename off
set -g automatic-rename off
set -g set-titles on
# set-titles-string is what a client is told to put on the window: with a literal it stamps
# that one string on every tab. "#W" is the window name, so the title agrees with the tab
# instead of overwriting it. (The live updates come from iTerm2 handling tmux's
# %window-renamed; set-titles only ever pushes a title for the client's current window.)
set -g set-titles-string "#W"
set -g remain-on-exit failed   # a crashed pane stays readable instead of taking the window down
set -g mouse off

# Messages (toasts) stay long enough to read.
set -g display-time 3000
