[package]
name = "gensokyo"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
croner = { version = "4.0.0", default-features = false, features = ["jiff"] }
jiff = "0.2.37"
libc = "0.2.189"
# Built from the Ghostty source scripts/ghostty.sh fetches; see .cargo/config.toml.
libghostty-vt = { version = "=0.2.1", default-features = false }
pty-process = { version = "=0.5.3", features = ["async"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["rt", "net", "io-util", "time", "macros", "signal", "process", "sync"] }

[dev-dependencies]
insta = "1.48.0"

[profile.release]
strip = true
